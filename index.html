<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <title>Firebase 讀寫測試</title>
</head>
<body>
    <h1>Firebase 讀寫測試</h1>

    <!-- 簡易操作介面 -->
    <div style="margin-bottom: 20px;">
        <h3>寫入資料</h3>
        <input type="text" id="userId" placeholder="使用者ID (例如: user1)" value="user1">
        <input type="text" id="userName" placeholder="姓名" value="測試使用者">
        <button id="writeBtn">寫入資料</button>
    </div>

    <div style="margin-bottom: 20px;">
        <h3>讀取資料</h3>
        <input type="text" id="readUserId" placeholder="要查詢的ID" value="user1">
        <button id="readBtn">讀取資料</button>
        <p id="result" style="font-weight: bold; color: blue;"></p>
    </div>

    <!-- Firebase 邏輯 -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, get, child } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "請在此填入您的真實apiKey",
            authDomain: "the-sunday-project-8411a.firebaseapp.com",
            databaseURL: "https://the-sunday-project-8411a-default-rtdb.firebaseio.com/",
            projectId: "the-sunday-project-8411a",
            storageBucket: "the-sunday-project-8411a.appspot.com",
            messagingSenderId: "請在此填入您的真實messagingSenderId",
            appId: "請在此填入您的真實appId"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 使用監聽器綁定按鈕，避免模組化作用域抓不到函數
        document.getElementById('writeBtn').addEventListener('click', function() {
            const id = document.getElementById('userId').value;
            const name = document.getElementById('userName').value;
            
            set(ref(db, 'users/' + id), {
                username: name,
                time: new Date().toLocaleString()
            }).then(() => {
                alert("資料寫入成功！");
            }).catch((error) => {
                alert("寫入失敗：" + error.message);
            });
        });

        document.getElementById('readBtn').addEventListener('click', function() {
            const id = document.getElementById('readUserId').value;
            const dbRef = ref(db);
            
            get(child(dbRef, `users/${id}`)).then((snapshot) => {
                const resultElement = document.getElementById('result');
                if (snapshot.exists()) {
                    resultElement.innerText = "讀取結果：" + JSON.stringify(snapshot.val());
                } else {
                    resultElement.innerText = "找不到該筆資料";
                }
            }).catch((error) => {
                console.error(error);
            });
        });
    </script>
</body>
</html>
